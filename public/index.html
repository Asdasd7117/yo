<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مختصر الروابط</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🔗 مختصر الروابط</h1>
    <input type="url" id="urlInput" placeholder="الصق الرابط الطويل هنا...">
    <button onclick="shorten()">اختصر</button>
    <div id="result"></div>
    <a href="/dashboard.html" class="dashboard-link">📊 لوحة التحكم</a>
  </div>
  <script>
    async function shorten() {
      const url = document.getElementById('urlInput').value;
      const res = await fetch('/api/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) {
        document.getElementById('result').innerHTML = `<p class="error">${data.error}</p>`;
      } else {
        document.getElementById('result').innerHTML = `
          <p class="success">الرابط القصير:</p>
          <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
          <button onclick="navigator.clipboard.writeText('${data.shortUrl}')">📋 نسخ</button>
        `;
      }
    }
  </script>
</body>
</html>
