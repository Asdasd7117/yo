<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحميل...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loader-container {
      text-align: center;
      color: white;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { font-size: 18px; margin-bottom: 10px; }
    .redirecting { font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <div class="loading-text">جاري التحميل...</div>
    <div class="redirecting">سيتم تحويلك خلال لحظات</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shortCode = params.get('code');
    const originalUrl = params.get('url');
    const deviceType = params.get('dt');
    const browser = params.get('br');
    const os = params.get('os');

    fetch('/api/click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shortCode, deviceType, browser, os })
    }).finally(() => {
      setTimeout(() => {
        window.location.replace(originalUrl);
      }, 1000);
    });
  </script>
</body>
</html>
