<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      text-align: center;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h2>جاري التحقق والتحويل...</h2>
    <p style="color: #7f8c8d; margin-top: 10px;">يرجى الانتظار قليلاً</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shortCode = params.get('code');
    const originalUrl = params.get('url');
    const deviceType = params.get('dt');
    const browser = params.get('br');
    const os = params.get('os');

    // جمع البصمة الرقمية صامتاً (بدون أي إذن)
    const fingerprint = {
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, // مثال: Asia/Riyadh
      language: navigator.language || navigator.userLanguage,     // مثال: ar-SA
      screen_res: `${window.screen.width}x${window.screen.height}`, // مثال: 390x844
      platform: navigator.platform
    };

    // إرسال البيانات فوراً
    fetch('/api/click', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        shortCode, deviceType, browser, os,
        timezone: fingerprint.timezone,
        language: fingerprint.language,
        screen_res: fingerprint.screen_res
      })
    }).finally(() => {
      // التحويل بعد ثانية واحدة لضمان إرسال البيانات
      setTimeout(() => {
        window.location.replace(originalUrl);
      }, 1000);
    });
  </script>
</body>
</html>
