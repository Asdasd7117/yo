<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container wide">
    <div class="header">
      <h1>📊 لوحة التحكم</h1>
      <a href="/" class="btn-back">← رجوع</a>
    </div>

    <div id="stats" class="stats-summary"></div>

    <table id="linksTable">
      <thead>
        <tr>
          <th>الرابط المختصر</th>
          <th>الرابط الأصلي</th>
          <th>النقرات</th>
          <th>التاريخ</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="loading">جاري التحميل...</td></tr>
      </tbody>
    </table>

    <div id="details" class="details-panel" style="display:none;"></div>
  </div>

  <script>
    let allLinks = [];

    async function loadLinks() {
      try {
        const res = await fetch('/api/dashboard');
        allLinks = await res.json();
        displayLinks();
        updateStats();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = 
          `<tr><td colspan="5" class="error">❌ خطأ في التحميل</td></tr>`;
      }
    }

    function displayLinks() {
      const tbody = document.getElementById('tableBody');
      if (allLinks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">لا توجد روابط</td></tr>';
        return;
      }
      tbody.innerHTML = allLinks.map(link => `
        <tr>
          <td><a href="/${link.short_code}" target="_blank" class="short-link">/${link.short_code}</a></td>
          <td class="url-cell" title="${link.original_url}">${link.original_url}</td>
          <td><strong>${link.clicks_count}</strong></td>
          <td>${new Date(link.created_at).toLocaleString('ar-SA')}</td>
          <td>
            <button onclick="showDetails('${link.short_code}')" class="btn-small">📈 التفاصيل</button>
            <button onclick="copyLink('${link.short_code}')" class="btn-small">📋 نسخ</button>
          </td>
        </tr>
      `).join('');
    }

    function updateStats() {
      const totalLinks = allLinks.length;
      const totalClicks = allLinks.reduce((sum, l) => sum + parseInt(l.clicks_count), 0);
      document.getElementById('stats').innerHTML = `
        <div class="stat-cards">
          <div class="stat-card"><div class="stat-value">${totalLinks}</div><div class="stat-label">الروابط</div></div>
          <div class="stat-card"><div class="stat-value">${totalClicks}</div><div class="stat-label">النقرات</div></div>
        </div>
      `;
    }

    async function showDetails(shortCode) {
      const detailsDiv = document.getElementById('details');
      detailsDiv.innerHTML = '<p class="loading">جاري تحميل التفاصيل...</p>';
      detailsDiv.style.display = 'block';

      try {
        const res = await fetch(`/api/clicks/${shortCode}`);
        const data = await res.json();

        if (data.clicks.length === 0) {
          detailsDiv.innerHTML = `
            <div class="details-header">
              <h3>📊 تفاصيل /${shortCode}</h3>
              <button onclick="closeDetails()" class="btn-close">✕</button>
            </div>
            <p class="no-data">لا توجد نقرات بعد</p>
          `;
          return;
        }

        const countries = {}, cities = {}, devices = {}, browsers = {}, osList = {}, sources = {};
        data.clicks.forEach(c => {
          if (c.country) countries[c.country] = (countries[c.country] || 0) + 1;
          if (c.city) cities[c.city] = (cities[c.city] || 0) + 1;
          devices[c.device_type] = (devices[c.device_type] || 0) + 1;
          browsers[c.browser] = (browsers[c.browser] || 0) + 1;
          osList[c.os] = (osList[c.os] || 0) + 1;
          
          // تحديد مصدر الموقع (GPS أو IP)
          const src = c.source === 'gps' ? '📍 GPS (دقيق)' : '🌐 IP (تقريبي)';
          sources[src] = (sources[src] || 0) + 1;
        });

        detailsDiv.innerHTML = `
          <div class="details-header">
            <h3>📊 تفاصيل النقرات - /${shortCode}</h3>
            <button onclick="closeDetails()" class="btn-close">✕</button>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <h4>🌍 الدول</h4>
              ${Object.entries(countries).map(([c,n]) => `<div class="stat-item"><span>${c}</span><strong>${n}</strong></div>`).join('')}
            </div>

            <div class="stat-box">
              <h4>🏙️ المدن</h4>
              ${Object.entries(cities).map(([c,n]) => `<div class="stat-item"><span>${c}</span><strong>${n}</strong></div>`).join('')}
            </div>

            <div class="stat-box">
              <h4>📱 الأجهزة</h4>
              ${Object.entries(devices).map(([d,n]) => `<div class="stat-item"><span>${d}</span><strong>${n}</strong></div>`).join('')}
            </div>

            <div class="stat-box">
              <h4>🌐 المتصفحات</h4>
              ${Object.entries(browsers).map(([b,n]) => `<div class="stat-item"><span>${b}</span><strong>${n}</strong></div>`).join('')}
            </div>

            <div class="stat-box">
              <h4>💻 أنظمة التشغيل</h4>
              ${Object.entries(osList).map(([o,n]) => `<div class="stat-item"><span>${o}</span><strong>${n}</strong></div>`).join('')}
            </div>

            <div class="stat-box">
              <h4>🎯 دقة الموقع</h4>
              ${Object.entries(sources).map(([s,n]) => `<div class="stat-item"><span>${s}</span><strong>${n}</strong></div>`).join('')}
            </div>
          </div>

          <h4>📋 سجل النقرات التفصيلي</h4>
          <table class="clicks-table">
            <thead>
              <tr>
                <th>#</th>
                <th>🌐 IP</th>
                <th>الدولة</th>
                <th>المدينة</th>
                <th>الجهاز</th>
                <th>المتصفح</th>
                <th>النظام</th>
                <th>🎯 الدقة</th>
                <th>🗺️ الموقع</th>
                <th>الوقت</th>
              </tr>
            </thead>
            <tbody>
              ${data.clicks.map((c, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td>
                    <code class="ip-code">${c.ip_address || '-'}</code>
                    ${c.ip_address ? `<br><a href="https://whatismyipaddress.com/ip/${c.ip_address}" target="_blank" class="ip-link">🔍 بحث</a>` : ''}
                  </td>
                  <td><strong>${c.country || '-'}</strong></td>
                  <td>${c.city || '-'}</td>
                  <td>${c.device_type || '-'}</td>
                  <td>${c.browser || '-'}</td>
                  <td>${c.os || '-'}</td>
                  <td>
                    ${c.source === 'gps' ? 
                      `<span style="color:#27ae60;font-weight:bold">📍 GPS<br><small>±${Math.round(c.accuracy)}م</small></span>` : 
                      `<span style="color:#e67e22">🌐 IP<br><small>تقريبي</small></span>`}
                  </td>
                  <td>
                    ${c.lat && c.lng ? 
                      `<a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" class="map-link">📍 عرض</a>
                      <br><small>(${c.lat.toFixed(4)}, ${c.lng.toFixed(4)})</small>` : 
                      '<span style="color:#999">غير متوفر</span>'}
                  </td>
                  <td>${new Date(c.clicked_at).toLocaleString('ar-SA')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          ${data.clicks.some(c => c.lat && c.lng) ? `
            <h4 style="margin-top:30px;">🗺️ خريطة المواقع</h4>
            <div class="map-container">
              <iframe 
                width="100%" 
                height="400" 
                frameborder="0" 
                scrolling="no" 
                marginheight="0" 
                marginwidth="0" 
                src="https://www.google.com/maps?q=${data.clicks[0].lat},${data.clicks[0].lng}&z=10&output=embed">
              </iframe>
            </div>
          ` : ''}
        `;

        detailsDiv.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        detailsDiv.innerHTML = `<p class="error">❌ خطأ في تحميل التفاصيل: ${err.message}</p>`;
      }
    }

    function closeDetails() {
      document.getElementById('details').style.display = 'none';
    }

    function copyLink(shortCode) {
      const fullUrl = `${window.location.origin}/${shortCode}`;
      navigator.clipboard.writeText(fullUrl).then(() => alert('✅ تم النسخ!'));
    }

    loadLinks();
  </script>
</body>
</html>
