<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 24px;
    }
    p {
      color: #7f8c8d;
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .progress {
      background: #ecf0f1;
      border-radius: 10px;
      height: 8px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.5s;
    }
    .status {
      font-size: 14px;
      color: #95a5a6;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🌍</div>
    <h2 id="title">جاري تحضير الرابط...</h2>
    <p id="message">نحتاج تحديد موقعك لتحسين الخدمة. سيظهر لك طلب إذن من المتصفح.</p>
    
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="loader" id="loader"></div>
    <div class="status" id="statusText">جاري بدء العملية...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shortCode = params.get('code');
    const originalUrl = params.get('url');
    const deviceType = params.get('dt');
    const browser = params.get('br');
    const os = params.get('os');

    function updateProgress(percent) {
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function updateStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function updateTitle(text) {
      document.getElementById('title').textContent = text;
    }

    function updateMessage(text) {
      document.getElementById('message').textContent = text;
    }

    async function sendClick(lat, lng, country, city, source) {
      try {
        await fetch('/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            shortCode, deviceType, browser, os,
            lat, lng, country, city, source
          })
        });
      } catch(e) { console.error(e); }
      
      updateProgress(100);
      updateStatus('جاري التحويل...');
      
      setTimeout(() => {
        window.location.replace(originalUrl);
      }, 800);
    }

    async function getLocation() {
      updateProgress(20);
      updateStatus('طلب إذن الموقع من المتصفح...');

      if ('geolocation' in navigator) {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            });
          });

          updateProgress(50);
          updateStatus('تم الحصول على الموقع، جاري تحديد التفاصيل...');

          const { latitude, longitude } = position.coords;

          // Reverse geocoding للحصول على اسم المدينة والدولة
          try {
            const geoRes = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar&zoom=10`
            );
            const geoData = await geoRes.json();
            const country = geoData.address?.country || null;
            const city = geoData.address?.city || geoData.address?.town || geoData.address?.state || null;

            updateProgress(80);
            updateStatus('تم تحديد الموقع بنجاح ✓');
            document.getElementById('icon').textContent = '✅';

            await sendClick(latitude, longitude, country, city, 'gps');
          } catch {
            await sendClick(latitude, longitude, null, null, 'gps');
          }

        } catch (err) {
          // المستخدم رفض أو فشل GPS → نستخدم IP
          updateStatus('تم رفض إذن الموقع، نستخدم الموقع التقريبي...');
          document.getElementById('icon').textContent = '📍';
          await sendClick(null, null, null, null, 'ip');
        }
      } else {
        updateStatus('المتصفح لا يدعم تحديد الموقع، نستخدم IP...');
        await sendClick(null, null, null, null, 'ip');
      }
    }

    // 🚀 ابدأ طلب الإذن فوراً عند تحميل الصفحة
    window.addEventListener('load', () => {
      setTimeout(getLocation, 500);
    });
  </script>
</body>
</html>
