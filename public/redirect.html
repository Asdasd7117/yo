<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .icon {
      font-size: 70px;
      margin-bottom: 20px;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 22px;
    }
    p {
      color: #7f8c8d;
      line-height: 1.7;
      margin-bottom: 25px;
      font-size: 15px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.03); }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-secondary {
      background: #ecf0f1;
      color: #7f8c8d;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .progress {
      background: #ecf0f1;
      border-radius: 10px;
      height: 8px;
      margin: 20px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      width: 0%;
      transition: width 0.5s;
    }
    .status {
      font-size: 14px;
      color: #95a5a6;
      margin-top: 10px;
    }
    .hidden { display: none !important; }
    .info-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">📍</div>
    <h2 id="title">اختر طريقة التحويل</h2>
    <p id="message">للحصول على إحصائيات دقيقة، نحتاج تحديد موقعك.</p>

    <!-- الأزرار -->
    <div id="choiceButtons">
      <button class="btn btn-primary" onclick="useGPS()">
        🎯 السماح بالموقع الدقيق (GPS)
      </button>
      <button class="btn btn-secondary" onclick="useIP()">
        ⏭️ تخطي (موقع تقريبي فقط)
      </button>
      <div class="info-box">
        💡 الموقع الدقيق = دقة بضعة أمتار<br>
        الموقع التقريبي = على مستوى المدينة فقط
      </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loadingScreen" class="hidden">
      <div class="loader"></div>
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="statusText">جاري...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shortCode = params.get('code');
    const originalUrl = params.get('url');
    const deviceType = params.get('dt');
    const browser = params.get('br');
    const os = params.get('os');

    function updateProgress(percent) {
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function updateStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function showLoading() {
      document.getElementById('choiceButtons').classList.add('hidden');
      document.getElementById('loadingScreen').classList.remove('hidden');
    }

    async function sendClick(lat, lng, country, city, source) {
      try {
        await fetch('/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            shortCode, deviceType, browser, os,
            lat, lng, country, city, source
          })
        });
      } catch(e) { console.error(e); }

      updateProgress(100);
      updateStatus('✅ تم! جاري التحويل...');

      setTimeout(() => {
        window.location.replace(originalUrl);
      }, 600);
    }

    // 🎯 خيار 1: GPS الدقيق
    async function useGPS() {
      showLoading();
      updateProgress(10);
      updateStatus('⏳ طلب إذن الموقع من المتصفح...');

      if (!('geolocation' in navigator)) {
        updateStatus(' المتصفح لا يدعم GPS، نستخدم IP...');
        await sendClick(null, null, null, null, 'ip');
        return;
      }

      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          });
        });

        updateProgress(40);
        updateStatus('✅ تم الحصول على الإحداثيات، جاري تحديد المدينة...');

        const { latitude, longitude } = position.coords;

        // Reverse geocoding من OpenStreetMap
        try {
          const geoRes = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar&zoom=14`
          );
          const geoData = await geoRes.json();
          const country = geoData.address?.country || null;
          const city = geoData.address?.city ||
                       geoData.address?.town ||
                       geoData.address?.village ||
                       geoData.address?.state || null;

          updateProgress(80);
          updateStatus(`📍 ${country} - ${city || 'غير معروف'}`);
          document.getElementById('icon').textContent = '✅';
          document.getElementById('title').textContent = 'تم تحديد موقعك!';

          await sendClick(latitude, longitude, country, city, 'gps');
        } catch (err) {
          // إذا فشل Nominatim، نرسل الإحداثيات فقط
          await sendClick(latitude, longitude, null, null, 'gps');
        }

      } catch (err) {
        // المستخدم رفض أو فشل
        updateStatus('⚠️ تم رفض الإذن، نستخدم الموقع التقريبي...');
        document.getElementById('icon').textContent = '📍';
        await sendClick(null, null, null, null, 'ip');
      }
    }

    // ⏭️ خيار 2: IP التقريبي
    async function useIP() {
      showLoading();
      updateProgress(30);
      updateStatus('🌐 جاري تحديد الموقع التقريبي...');
      document.getElementById('icon').textContent = '🌐';

      await sendClick(null, null, null, null, 'ip');
    }
  </script>
</body>
</html>
